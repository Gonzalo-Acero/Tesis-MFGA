<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFGA - Register</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#75AADB',
              secondary: '#F6D54A',
            }
          }
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center bg-cover bg-center" style="background-image: url('http://static.photos/travel/1200x630/42')">
    <div class="absolute inset-0 bg-black bg-opacity-40"></div>
    
    <div class="relative w-full max-w-md mx-4">
        <!-- Registration Header -->
        <div class="mb-6 rounded-lg bg-white bg-opacity-20 backdrop-filter backdrop-blur-lg shadow-lg overflow-hidden">
            <h1 class="py-4 px-6 text-center font-bold text-2xl text-white">Join MFGA</h1>
        </div>

        <!-- Registration Form -->
        <div class="bg-white bg-opacity-20 backdrop-filter backdrop-blur-lg rounded-xl shadow-xl p-8 transition-all duration-300">
            <h2 class="text-2xl font-bold text-white mb-2">Join MFGA and start your adventure!</h2>
            <p class="text-white mb-6">Discover Argentina like a local</p>
            
            <form>
                <div class="mb-4">
                    <label class="block text-white text-sm font-medium mb-2" for="register-name">Full Name</label>
                    <input id="register-name" type="text" class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-70 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300" placeholder="Juan Perez">
                    <p class="text-xs text-red-200 mt-1 hidden" id="register-name-error">Please enter your name</p>
                </div>
                
                <div class="mb-4">
                    <label class="block text-white text-sm font-medium mb-2" for="register-email">Email</label>
                    <input id="register-email" type="email" class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-70 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300" placeholder="your@email.com">
                    <p class="text-xs text-red-200 mt-1 hidden" id="register-email-error">Please enter a valid email</p>
                </div>
                
                <div class="mb-4">
                    <label class="block text-white text-sm font-medium mb-2" for="register-password">Password</label>
                    <input id="register-password" type="password" class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-70 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300" placeholder="••••••••">
                    <p class="text-xs text-red-200 mt-1 hidden" id="register-password-error">Password must be at least 8 characters</p>
                </div>
                
                <div class="mb-6">
                    <label class="block text-white text-sm font-medium mb-2" for="register-confirm">Confirm Password</label>
                    <input id="register-confirm" type="password" class="w-full px-4 py-3 rounded-lg bg-white bg-opacity-70 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary transition-all duration-300" placeholder="••••••••">
                    <p class="text-xs text-red-200 mt-1 hidden" id="register-confirm-error">Passwords don't match</p>
                </div>
                
                <div class="flex items-center mb-6">
                    <input id="terms-check" type="checkbox" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <label for="terms-check" class="ml-2 block text-sm text-white">
                        I agree to the <a href="#" class="text-secondary hover:underline">Terms</a> and <a href="#" class="text-secondary hover:underline">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 flex items-center justify-center">
                    <i data-feather="user-plus" class="mr-2"></i> Register
                </button>
            </form>
            
            <div class="mt-6 text-center">
                <p class="text-white text-sm">Already have an account? <a href="/login.html" class="text-secondary hover:underline font-medium">Login here</a></p>
            </div>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white border-opacity-30"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-transparent text-white">Or sign up with</span>
                    </div>
                </div>
                
                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button class="w-full flex items-center justify-center px-4 py-2 bg-white bg-opacity-70 hover:bg-opacity-100 rounded-lg transition-all duration-300">
                        <i data-feather="github" class="mr-2"></i> Google
                    </button>
                    <button class="w-full flex items-center justify-center px-4 py-2 bg-white bg-opacity-70 hover:bg-opacity-100 rounded-lg transition-all duration-300">
                        <i data-feather="twitter" class="mr-2"></i> Apple
                    </button>
                </div>
            </div>
        </div>
        
        <div class="mt-6 text-center">
            <a href="/" class="text-white text-sm hover:underline flex items-center justify-center">
                <i data-feather="arrow-left" class="mr-1"></i> Return to homepage
            </a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>feather.replace();</script>
</body>
</html>
