<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MFGA - My Profile</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="header.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="../env.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'argentina-blue': '#75AADB',
                        'argentina-yellow': '#F6D54A',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen" data-api-base-url="/api">
    <!-- Navbar -->
    <nav class="bg-white shadow-sm relative">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-4">
                    <span class="text-xl font-bold text-argentina-blue">MFGA</span>
                    <button id="mobileNavToggle" class="md:hidden text-gray-600 hover:text-argentina-blue focus:outline-none" aria-label="Open menu">
                        <i data-feather="menu" class="w-6 h-6"></i>
                    </button>
                </div>
                <div
                  id="navLinks"
                  class="hidden flex flex-col gap-4 absolute top-full left-0 right-0 bg-white shadow-lg border-b border-gray-100 px-4 py-4 z-40 md:flex md:flex-row md:items-center md:gap-6 md:static md:shadow-none md:border-none md:bg-transparent md:px-0 md:py-0"
                >
                    <a href="#inicio" class="text-gray-700 font-medium hover:text-argentina-blue transition-colors">Home</a>
                    <a href="#conocenos" class="text-gray-700 font-medium hover:text-argentina-blue transition-colors">About Us</a>
                    <a href="#app-mfga" class="text-gray-700 font-medium hover:text-argentina-blue transition-colors">MFGA App</a>
                    <a href="#experiencias" class="text-gray-700 font-medium hover:text-argentina-blue transition-colors">Experiences</a>
                    <a href="#contacto" class="text-gray-700 font-medium hover:text-argentina-blue transition-colors">Contact</a>
                </div>
                <div class="flex items-center">
                    <div class="relative ml-3">
                        <button id="profileButton" class="flex items-center focus:outline-none">
                            <img data-user-avatar class="h-8 w-8 rounded-full" src="http://static.photos/people/200x200/42" alt="Profile">
                        </button>
                        <div
                          id="profileDropdown"
                          data-logout-url="../Login_Register/Login.html"
                          class="hidden origin-top-right absolute right-0 mt-2 w-64 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none transform transition-all duration-200 ease-out scale-95 opacity-0 z-50"
                        >
                            <div class="py-3 px-4 border-b border-gray-200">
                                <div class="flex items-center space-x-3">
                                    <img data-user-avatar class="h-10 w-10 rounded-full" src="http://static.photos/people/200x200/42" alt="Profile">
                                    <div>
                                        <p class="text-sm font-medium text-gray-900" data-user-name>MFGA Explorer</p>
                                        <p class="text-xs text-gray-500" data-user-email>user@example.com</p>
                                    </div>
                                </div>
                            </div>
                            <div class="py-1">
                                <a href="#" data-profile-action="edit-profile" class="block px-4 py-2 text-sm text-gray-700 hover:bg-argentina-blue hover:text-white transition-colors duration-200">
                                    <i data-feather="user" class="inline mr-2 w-4 h-4"></i> Edit Profile
                                </a>
                                <a href="#" data-profile-action="change-email" class="block px-4 py-2 text-sm text-gray-700 hover:bg-argentina-blue hover:text-white transition-colors duration-200">
                                    <i data-feather="mail" class="inline mr-2 w-4 h-4"></i> Change Email
                                </a>
                                <a href="#" data-profile-action="change-password" class="block px-4 py-2 text-sm text-gray-700 hover:bg-argentina-blue hover:text-white transition-colors duration-200">
                                    <i data-feather="lock" class="inline mr-2 w-4 h-4"></i> Change Password
                                </a>
                                <div class="border-t border-gray-200"></div>
                                <a href="#" data-profile-action="logout" class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors duration-200">
                                    <i data-feather="log-out" class="inline mr-2 w-4 h-4"></i> Log out
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
       
    </main>

    <div id="editProfileModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div data-modal-panel class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all duration-300 scale-95 opacity-0">
            <form data-profile-form class="flex flex-col h-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">Edit profile</h3>
                </div>
                <div class="px-6 py-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="profile-name">Full name</label>
                        <input id="profile-name" name="profileName" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-argentina-blue" placeholder="Full name" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="profile-email">Email</label>
                        <input id="profile-email" name="profileEmail" type="email" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-argentina-blue" placeholder="user@email.com" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="profile-phone">Phone number</label>
                        <input id="profile-phone" name="profilePhone" type="tel" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-argentina-blue" placeholder="+54 9 11 1111-1111">
                    </div>
                    <p data-form-feedback class="text-sm text-red-600 hidden"></p>
                </div>
                <div class="px-6 py-4 bg-gray-50 text-right">
                    <button type="button" data-modal-close class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md mr-2">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-argentina-blue text-white rounded-md" data-profile-submit>Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <div id="changePasswordModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div data-modal-panel class="bg-white rounded-lg shadow-xl w-full max-w-md transform transition-all duracion-300 scale-95 opacity-0">
            <form data-password-form class="flex flex-col h-full">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 class="text-lg font-medium text-gray-900">Change password</h3>
                </div>
                <div class="px-6 py-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="current-password">Current password</label>
                        <input id="current-password" name="currentPassword" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-argentina-blue" placeholder="Enter your password" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="new-password">New password</label>
                        <input id="new-password" name="newPassword" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-argentina-blue" placeholder="Minimum 6 characters" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1" for="confirm-password">Confirm password</label>
                        <input id="confirm-password" name="confirmPassword" type="password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-argentina-blue" placeholder="Re-enter the new password" required>
                    </div>
                    <p data-password-feedback class="text-sm text-red-600 hidden"></p>
                </div>
                <div class="px-6 py-4 bg-gray-50 text-right">
                    <button type="button" data-modal-close class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md mr-2">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-argentina-blue text-white rounded-md" data-password-submit>Update</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../shared/session.js"></script>
    <script>
        window.__API_BASE_URL__ =
          window.__API_BASE_URL__ ||
          document.body.getAttribute("data-api-base-url") ||
          "http://localhost:4000/api";
    </script>
    <script src="header.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
