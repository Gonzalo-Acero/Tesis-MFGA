openapi: 3.0.0
info:
  title: MFGA Backend API
  version: 1.0.0
  description: API documentation for the MFGA backend (attractions, guides, users, community, auth)
servers:
  - url: http://localhost:4000
paths:
  /api/attractions:
    get:
      summary: List attractions
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: province
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Array of attractions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attraction'

  /api/attractions/nearby:
    get:
      summary: Find nearby attractions
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
            format: float
        - in: query
          name: lng
          required: true
          schema:
            type: number
            format: float
        - in: query
          name: radiusKm
          schema:
            type: number
            format: float
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: province
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Array of nearby attractions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attraction'

  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /api/auth/change-password:
    post:
      summary: Change password (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: integer
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated

  /api/auth/verify-email:
    get:
      summary: Verify user email by token
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to login after verification

  /api/community/posts:
    get:
      summary: List community posts
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        '200':
          description: Array of posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommunityPost'
    post:
      summary: Create community post (authenticated)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                location:
                  type: string
                region:
                  type: string
                message:
                  type: string
                imageUrl:
                  type: string
      responses:
        '201':
          description: Created post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommunityPost'

  /api/community/posts/likes:
    get:
      summary: Get liked post ids for current user (authenticated)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of liked post ids
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /api/community/posts/{id}/comments:
    get:
      summary: Get comments for a post
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      summary: Add comment to a post (authenticated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment:
                    $ref: '#/components/schemas/Comment'
                  commentCount:
                    type: integer

  /api/community/posts/{id}/likes:
    post:
      summary: Toggle like for a post (authenticated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Like toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  likeCount:
                    type: integer

  /api/guides:
    get:
      summary: List guides
      responses:
        '200':
          description: Array of guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guide'

  /api/guides/resolve:
    get:
      summary: Resolve guide by name or alias
      parameters:
        - in: query
          name: name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Guide resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideDetail'

  /api/guides/{id}:
    get:
      summary: Get guide by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Guide detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideDetail'

  /api/guides/{id}/comments:
    get:
      summary: Get guide comments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Array of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      summary: Add comment to guide (authenticated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        '201':
          description: Comment created

  /api/guides/{id}/ratings:
    post:
      summary: Add or update rating for a guide (authenticated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating:
                  type: number
                  minimum: 1
                  maximum: 5
      responses:
        '200':
          description: Rating summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ratingAverage:
                    type: number
                    nullable: true
                  ratingCount:
                    type: integer

  /api/guides/{id}/messages:
    post:
      summary: Send message to guide (authenticated)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Message sent

  /api/users:
    get:
      summary: List users
      responses:
        '200':
          description: Array of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'

  /api/users/{id}:
    get:
      summary: Get user by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      summary: Update user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                properties:
                  Usuario eliminado:
                    type: boolean

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        UserId:
          type: integer
        Name:
          type: string
        Email:
          type: string
        PhoneNumber:
          type: string
        CreationDate:
          type: string
          format: date-time
        LastLogin:
          type: string
          format: date-time
        IsActive:
          type: boolean
        is_verified:
          type: boolean

    UserCreate:
      type: object
      required:
        - Name
        - Email
        - Password
      properties:
        Name:
          type: string
        Email:
          type: string
        Password:
          type: string
        PhoneNumber:
          type: string

    UserUpdate:
      type: object
      properties:
        Name:
          type: string
        Email:
          type: string
        Password:
          type: string
        PhoneNumber:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    Attraction:
      type: object
      properties:
        AttractionId:
          type: integer
        Name:
          type: string
        Description:
          type: string
        Category:
          type: string
        Province:
          type: string
        ImageUrl:
          type: string
        Latitude:
          type: number
        Longitude:
          type: number
        DistanceKm:
          type: number
        Rating:
          type: number
        IsActive:
          type: boolean
        CreatedAt:
          type: string
          format: date-time

    Guide:
      type: object
      properties:
        GuideId:
          type: integer
        Name:
          type: string
        AvatarUrl:
          type: string
        IsActive:
          type: boolean
        CreatedAt:
          type: string
          format: date-time

    GuideDetail:
      allOf:
        - $ref: '#/components/schemas/Guide'
        - type: object
          properties:
            ratingAverage:
              type: number
              nullable: true
            ratingCount:
              type: integer

    CommunityPost:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        author:
          type: string
        avatar:
          type: string
        location:
          type: string
        region:
          type: string
        category:
          type: string
        message:
          type: string
        image:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        likeCount:
          type: integer
        commentCount:
          type: integer

    Comment:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: integer
        userId:
          type: integer
        userName:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
